name: circulus
description: "CIRCULUS - Beyond Ranks. Beyond Boundaries. Exclusive Professional Social Networking Platform for Verified Officers and Faculty."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.2.0

  # Networking & API
  dio: ^5.4.3+1
  http: ^1.2.1

  # Supabase & Auth
  supabase_flutter: ^2.5.6

  # Storage & Secure Cache
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0
  flutter_spinkit: ^5.2.1

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
